<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cancel booking — LuxRun</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#F7F6F1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:20px;padding:48px 40px;max-width:480px;width:100%;text-align:center;border:1px solid #DDDDD0}
.icon{font-size:48px;margin-bottom:24px}
h1{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;margin-bottom:10px;letter-spacing:-0.02em}
.subtitle{font-size:15px;color:#8C8C7A;margin-bottom:28px;line-height:1.6}
.booking-details{background:#F7F6F1;border-radius:12px;padding:20px;margin-bottom:24px;text-align:left}
.booking-details p{font-size:14px;color:#3B3B30;margin-bottom:6px}
.booking-details p:last-child{margin-bottom:0}
.booking-details strong{color:#18180F}
.warning{background:#FFF8E6;border:1px solid #F0D060;border-radius:12px;padding:16px;margin-bottom:24px;font-size:14px;color:#7A5F00;line-height:1.6}
.btn-cancel{width:100%;background:#EF4444;color:#fff;border:none;padding:15px;border-radius:12px;font-size:16px;font-weight:600;font-family:'Syne',sans-serif;cursor:pointer;transition:background 0.2s;margin-bottom:12px}
.btn-cancel:hover{background:#DC2626}
.btn-cancel:disabled{background:#ccc;cursor:default}
.btn-back{display:block;font-size:14px;color:#8C8C7A;text-decoration:none;margin-top:8px}
.btn-back:hover{color:#18180F}
.success{display:none}
.error-msg{color:#EF4444;font-size:14px;margin-top:12px}
#loading{color:#8C8C7A;font-size:15px}
</style>
</head>
<body>
<div class="card">
  <div id="loading">
    <div class="icon">⏳</div>
    <h1>Loading your booking...</h1>
  </div>

  <div id="content" style="display:none">
    <div class="icon">⚠️</div>
    <h1>Cancel your booking</h1>
    <p class="subtitle" id="subtitle">Are you sure you want to cancel?</p>
    <div class="booking-details" id="booking-details"></div>
    <div class="warning" id="warning" style="display:none"></div>
    <button class="btn-cancel" id="confirm-btn" onclick="confirmCancel()">Yes, cancel my booking</button>
    <a href="/" class="btn-back">No, keep my booking</a>
    <p class="error-msg" id="error-msg"></p>
  </div>

  <div class="success" id="success">
    <div class="icon">✅</div>
    <h1>Booking cancelled</h1>
    <p class="subtitle">Your booking has been cancelled and your refund is on its way. It will appear on your statement within 5-10 business days.</p>
    <a href="/" style="display:inline-block;margin-top:24px;background:#D6F53C;color:#18180F;padding:12px 28px;border-radius:100px;font-family:'Syne',sans-serif;font-weight:700;font-size:15px;text-decoration:none">Back to LuxRun</a>
  </div>
</div>

<script>
const token = new URLSearchParams(window.location.search).get('token');

async function loadBooking() {
  if (!token) {
    document.getElementById('loading').innerHTML = '<div class="icon">❌</div><h1>Invalid link</h1><p class="subtitle">This cancellation link is invalid or has expired.</p>';
    return;
  }

  try {
    const res = await fetch(`/api/cancel?token=${token}&action=check`);
    const data = await res.json();

    if (!res.ok) {
      document.getElementById('loading').innerHTML = `<div class="icon">❌</div><h1>Not found</h1><p class="subtitle">${data.error || 'Booking not found.'}</p>`;
      return;
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    document.getElementById('booking-details').innerHTML = `
      <p><strong>Name:</strong> ${data.name}</p>
      <p><strong>Date:</strong> ${data.date}</p>
      <p><strong>Participants:</strong> ${data.people}</p>
    `;

    if (!data.canCancel) {
      document.getElementById('warning').style.display = 'block';
      document.getElementById('warning').innerHTML = `This booking is less than 24 hours away and is no longer eligible for a free cancellation. Cancellations at this stage are non-refundable.`;
      document.getElementById('confirm-btn').disabled = true;
      document.getElementById('confirm-btn').textContent = 'Cancellation window expired';
    }

  } catch (err) {
    document.getElementById('loading').innerHTML = '<div class="icon">❌</div><h1>Error</h1><p class="subtitle">Something went wrong. Please try again.</p>';
  }
}

async function confirmCancel() {
  const btn = document.getElementById('confirm-btn');
  btn.textContent = 'Processing...';
  btn.disabled = true;

  try {
    const res = await fetch('/api/cancel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, action: 'confirm' }),
    });
    const data = await res.json();

    if (data.success) {
      document.getElementById('content').style.display = 'none';
      document.getElementById('success').style.display = 'block';
    } else {
      document.getElementById('error-msg').textContent = data.error || 'Something went wrong.';
      btn.textContent = 'Yes, cancel my booking';
      btn.disabled = false;
    }
  } catch (err) {
    document.getElementById('error-msg').textContent = 'Something went wrong. Please try again.';
    btn.textContent = 'Yes, cancel my booking';
    btn.disabled = false;
  }
}

loadBooking();
</script>
</body>
</html>
