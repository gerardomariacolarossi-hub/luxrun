<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking confirmed — LuxRun</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#F7F6F1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:20px;padding:48px 40px;max-width:480px;width:100%;text-align:center;border:1px solid #DDDDD0}
.icon{font-size:56px;margin-bottom:24px}
h1{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;margin-bottom:12px;letter-spacing:-0.02em}
p{font-size:16px;color:#555;line-height:1.7;margin-bottom:8px}
.note{font-size:14px;color:#8C8C7A;margin-top:20px;padding:16px;background:#F7F6F1;border-radius:12px;line-height:1.6}
.back{display:inline-block;margin-top:28px;background:#D6F53C;color:#18180F;padding:12px 28px;border-radius:100px;font-family:'Syne',sans-serif;font-weight:700;font-size:15px;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🎉</div>
  <h1>You're in!</h1>
  <p>Your booking is confirmed.</p>
  <p>Check your email for all the details.</p>
  <div class="note">
    <strong>Before the tour:</strong> you will receive a separate email with your personal QR code. Download the app in advance — it works fully offline via GPS, no internet needed during the run.
  </div>
  <a href="/" class="back">Back to LuxRun</a>
</div>
</body>
</html>
